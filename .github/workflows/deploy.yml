name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in a step-level `if`, so it is mapped here.
      DISPLAY_FONT_B64: ${{ secrets.DISPLAY_FONT_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The display font is licensed separately and is not in the repository.
      # Store it base64-encoded in the DISPLAY_FONT_B64 repository secret to ship
      # it with the deployed build; without the secret the game falls back to the
      # stack in styles.css and everything else still works.
      - name: Restore display font
        if: ${{ env.DISPLAY_FONT_B64 != '' }}
        run: |
          # Never fail the deploy over a cosmetic asset: a bad secret must degrade
          # to the fallback font stack, not take the whole site down with it.
          set +e
          mkdir -p public/fonts
          out=public/fonts/BD_Cartoon_Shout.ttf
          # Pasting into the secret field can introduce newlines and stray
          # whitespace, which strict base64 refuses to decode.
          printf '%s' "$DISPLAY_FONT_B64" | tr -d '[:space:]' | base64 -di > "$out" 2>/dev/null
          size=$(wc -c < "$out" 2>/dev/null || echo 0)
          magic=$(head -c 4 "$out" | od -An -tx1 | tr -d ' 
')
          # TrueType files start with 00010000, OpenType with 'OTTO' (4f54544f).
          if [ "$size" -gt 1000 ] && { [ "$magic" = "00010000" ] || [ "$magic" = "4f54544f" ]; }; then
            echo "display font restored: $size bytes"
          else
            echo "::warning::DISPLAY_FONT_B64 did not decode to a font (size=$size magic=$magic). Building with the fallback font."
            rm -f "$out"
          fi
          exit 0

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
