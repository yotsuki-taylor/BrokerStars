name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running: a
# Pages deploy killed mid-flight is what "Deployment failed, try again later"
# tends to mean. Queued runs wait their turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both are baked into the client bundle and readable by anyone who opens
      # the JS, which is why neither is a secret in any real sense. VITE_ADMIN_ID
      # only hides the dev buttons from ordinary players (see admin.ts), and the
      # API url is a public endpoint that refuses anything unsigned anyway —
      # hence a repository variable rather than a secret.
      - run: npm run build
        env:
          VITE_ADMIN_ID: ${{ secrets.MY_ID }}
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
