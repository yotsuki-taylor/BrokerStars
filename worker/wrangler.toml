name = "broker-stars-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# BOT_TOKEN is NOT here and must never be. It is a secret:
#   wrangler secret put BOT_TOKEN
# Without it the Worker refuses every write, which is the behaviour we want —
# a board that takes unsigned scores is worse than no board.

[observability]
enabled = true

# Where the game is served from. The bot answers /start with a button that opens
# it, so the Worker has to know the address (worker/src/bot.ts). Public, and in
# here beside the database id below for the same reason that is: it names this
# deployment rather than protecting it.
#
# ADMIN_ID is the developer's Telegram id, the same one the game is built with
# as VITE_ADMIN_ID. All it buys is free purchases and refunds in the shop, and
# only for a caller whose id arrived on a signature Telegram put there — so
# unlike the client's own copy of it (src/ui/admin.ts, which says as much) this
# one is actually checked. Leave it out and nobody gets the dev prices, which
# is the right answer for a deployment that is not yours.
#
# CHAT_ID is the game's group chat -- the one the friends menu sends people who
# have nobody to play with. With it set, the duel screen grows a button that
# has the bot call the duel out in there (worker/src/chat.ts); without it that
# button never appears and the route answers "not configured", which is the
# right behaviour for anybody else's deployment. Not a secret: posting into a
# chat needs the bot's token and this is not it. To find the id, add the bot to
# the group and say `/chat` in it -- the bot answers with the number, which
# goes below with the minus sign it comes with.
#
# SESSION_SECRET is NOT here either, for the same reason BOT_TOKEN is not:
#   wrangler secret put SESSION_SECRET
# It is what the Worker signs its own sessions with, and anybody holding it can
# mint one for any player. Only an Android build needs it; without it sessions
# are refused and Telegram players never notice (worker/src/auth.ts).
#
# GOOGLE_CLIENT_ID below is the WEB client from the Google Cloud project, not
# the Android one, because the web client is what an Android sign-in names as
# its audience. Public — it is compiled into the app, where anybody can read it
# — and its whole job is to refuse a token minted for somebody else's
# application, which is the one thing standing between this game and every
# other Google sign-in on earth (worker/src/auth.ts).
#
# Setting it is not enough on its own: /auth/google also needs SESSION_SECRET,
# which is a secret and is not here, and answers 503 until both exist.
[vars]
WEBAPP_URL = "https://yotsuki-taylor.github.io/BrokerStars/"
ADMIN_ID = "165233146"
CHAT_ID = "-1004363436099"
GOOGLE_CLIENT_ID = "814427976892-u602o00j2nedkmunlu0p9k8chbi27raf.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "broker-stars"
database_id = "2006f293-59fc-4af9-b7e9-10b4d4ceab76"

# Duels. One object per invitation code: it holds the lobby, then runs the
# match itself and talks to both players over WebSockets (worker/src/duel.ts).
[[durable_objects.bindings]]
name = "DUEL"
class_name = "Duel"

# The object keeps only the invitation in storage, but it keeps it in SQLite —
# `new_sqlite_classes` is the current backend and the one new classes should be
# created on.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Duel"]
